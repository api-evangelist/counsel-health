name: Counsel Health
description: >-
  Counsel Health is a telemedicine company multiplying the world's healthcare
  capacity by pairing an AI medical assistant with board-certified physicians
  delivered through chat. Individuals get free AI medical guidance and can
  connect with a licensed doctor for a flat $29 per consultation, seven days a
  week, for urgent care, primary care support, medication refills, lab testing,
  and health-record management. Counsel also ships an embedded product — a
  WebView / iFrame surface plus a server-side Counsel API — that partners
  integrate into their own applications, documented at docs.counselhealth.com
  with example apps published on GitHub. Backed by GV (Google Ventures).
